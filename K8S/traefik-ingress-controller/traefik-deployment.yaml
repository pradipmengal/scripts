apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress-control
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        fsGroup: 65532
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: traefik
          image: traefik:v3.0.1
          args:
            # EntryPoints (non-privileged internal ports)
            - --entryPoints.web.address=:8000
            - --entryPoints.websecure.address=:8443
            - --entryPoints.metrics.address=:9100

            # Metrics
            - --metrics.prometheus=true
            - --metrics.prometheus.entryPoint=metrics

            # Ping for health checks
            - --ping=true
            - --ping.entryPoint=web

            # Logging
            - --log.level=INFO
            - --accesslog=true
            - --accesslog.format=json

            # Kubernetes Providers
            - --providers.kubernetescrd
            - --providers.kubernetesingress
                       
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
            - name: metrics
              containerPort: 9100
            - name: ping
              containerPort: 8082

          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

   

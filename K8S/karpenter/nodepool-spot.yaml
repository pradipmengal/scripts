apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: prod-nodepool-spot
spec:
  weight: 100
  template:
    metadata:
      labels:
        workload: application
        nodegroup: karpenter-prod-spot
    spec:
      nodeClassRef:
        name: prod-ec2
      taints:
        - key: karpenter.sh/workload
          value: application
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t","m"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large"]
        - key: karpenter.k8s.aws/instance-generation
          operator: In
          values: ["5", "6"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-south-2a","ap-south-2b"]
  limits:
    cpu: "1000"
    memory: 2000Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 168h


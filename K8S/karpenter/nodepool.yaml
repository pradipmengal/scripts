apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: prod-nodepool
spec:
  template:
    metadata:
      labels:
        workload: application
        nodegroup: karpenter-prod
    spec:
      nodeClassRef:
        name: prod-ec2

      taints:
        - key: karpenter.sh/workload
          value: application
          effect: NoSchedule

      requirements:
        # Core OS & Arch
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # Instance selection (COST + PERFORMANCE)
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]

        # Capacity type preference
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # AZ spread for HA
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-south-2a
            - ap-south-2b
            - ap-south-2c

  limits:
    cpu: "1000"
    memory: 2000Gi

  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h

